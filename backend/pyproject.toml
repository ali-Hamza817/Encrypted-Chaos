# Dependencies live in requirements.txt / requirements-dev.txt (not here) so that
# deploy builders install exactly the lean runtime set. This file is metadata +
# pytest config only.

[project]
name = "encrypted-chaos"
version = "0.1.0"
description = "Deep-learning cryptanalysis of chaos-based image encryption"
readme = "README.md"
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
